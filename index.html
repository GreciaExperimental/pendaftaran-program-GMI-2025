<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pendaftaran</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
        body {
            box-sizing: border-box;
        }
        
        .success-animation {
            animation: successPulse 0.6s ease-out;
        }
        
        @keyframes successPulse {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .loading-spinner {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
  <style>@view-transition { navigation: auto; }</style>
 </head>
 <body class="h-full bg-gradient-to-br from-blue-50 to-indigo-100 font-sans">
  <div class="min-h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
   <div class="max-w-md w-full space-y-8"><!-- Header -->
    <div class="text-center">
     <div class="mx-auto h-12 w-12 bg-indigo-600 rounded-full flex items-center justify-center mb-4">
      <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
      </svg>
     </div>
     <h2 id="form-title" class="text-3xl font-bold text-gray-900">Daftar Sekarang – Kuota Terbatas!</h2>
     <p id="form-subtitle" class="mt-2 text-sm text-red-600 font-medium">⚡ Kesempatan terbatas! Segera daftar sebelum kuota habis</p>
    </div><!-- Registration Form -->
    <form id="registrationForm" class="mt-8 space-y-6 bg-white p-8 rounded-xl shadow-lg"><!-- Full Name -->
     <div><label for="fullName" class="block text-sm font-medium text-gray-700 mb-2">Nama Lengkap</label> <input type="text" id="fullName" name="fullName" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500" placeholder="Masukkan nama lengkap Anda">
     </div><!-- Age -->
     <div><label for="age" class="block text-sm font-medium text-gray-700 mb-2">Usia</label> <input type="number" id="age" name="age" required min="16" max="65" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500" placeholder="Contoh: 25">
     </div><!-- Origin -->
     <div><label for="origin" class="block text-sm font-medium text-gray-700 mb-2">Asal Daerah</label> <input type="text" id="origin" name="origin" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500" placeholder="Contoh: Jakarta, Bandung, Surabaya">
     </div><!-- Education -->
     <div><label for="education" class="block text-sm font-medium text-gray-700 mb-2">Pendidikan Terakhir</label> <select id="education" name="education" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"> <option value="">Pilih pendidikan terakhir</option> <option value="SMA/SMK">SMA/SMK</option> <option value="D3">Diploma 3 (D3)</option> <option value="S1">Sarjana (S1)</option> <option value="S2">Magister (S2)</option> <option value="S3">Doktor (S3)</option> <option value="Lainnya">Lainnya</option> </select>
     </div><!-- Reason -->
     <div><label for="reason" class="block text-sm font-medium text-gray-700 mb-2">Alasan Mengikuti Program</label> <textarea id="reason" name="reason" rows="4" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500" placeholder="Ceritakan motivasi dan tujuan Anda mengikuti program ini..."></textarea>
     </div><!-- Scholarship Path -->
     <div><label class="block text-sm font-medium text-gray-700 mb-3">Pilihan Jalur</label>
      <div class="space-y-3"><label class="flex items-center p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer"> <input type="radio" name="path" value="Beasiswa" required class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300">
        <div class="ml-3"><span class="text-sm font-medium text-gray-900">🎓 Jalur Beasiswa</span>
         <p class="text-xs text-gray-500">Program gratis dengan syarat dan ketentuan berlaku</p>
        </div></label> <label class="flex items-center p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer"> <input type="radio" name="path" value="Non-Beasiswa" required class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300">
        <div class="ml-3"><span class="text-sm font-medium text-gray-900">💳 Jalur Non-Beasiswa</span>
         <p class="text-xs text-gray-500">Program berbayar dengan akses penuh</p>
        </div></label>
      </div>
     </div><!-- Submit Button -->
     <div><button type="submit" id="submitBtn" class="w-full flex justify-center items-center py-4 px-6 border border-transparent rounded-lg shadow-lg text-lg font-bold text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed transform hover:scale-105"> <span class="text-2xl mr-2">🟢</span> <span id="submit-button-text">KIRIM FORM &amp; HUBUNGI VIA WHATSAPP</span>
       <svg id="loading-spinner" class="hidden ml-2 h-5 w-5 loading-spinner" fill="none" stroke="currentColor" viewbox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"></circle> <path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" class="opacity-75"></path>
       </svg></button>
     </div><!-- Success Message -->
     <div id="successMessage" class="hidden mt-4 p-4 bg-green-50 border border-green-200 rounded-md">
      <div class="flex items-center">
       <svg class="h-5 w-5 text-green-400 mr-2" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
       </svg>
       <div>
        <p class="text-sm text-green-800 font-medium">✅ Pendaftaran berhasil tersimpan!</p>
        <p class="text-xs text-green-700 mt-1">Anda akan diarahkan ke WhatsApp untuk konfirmasi lebih lanjut...</p>
       </div>
      </div>
     </div><!-- Error Message -->
     <div id="errorMessage" class="hidden mt-4 p-4 bg-red-50 border border-red-200 rounded-md">
      <div class="flex items-center">
       <svg class="h-5 w-5 text-red-400 mr-2" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
       </svg>
       <p class="text-sm text-red-800">Terjadi kesalahan. Silakan coba lagi.</p>
      </div>
     </div>
    </form>
   </div>
  </div>
  <script>
        // Default configuration
        const defaultConfig = {
            form_title: "Daftar Sekarang – Kuota Terbatas!",
            form_subtitle: "⚡ Kesempatan terbatas! Segera daftar sebelum kuota habis",
            submit_button_text: "KIRIM FORM & HUBUNGI VIA WHATSAPP",
            primary_color: "#16a34a",
            surface_color: "#ffffff",
            text_color: "#374151",
            success_color: "#10b981",
            error_color: "#ef4444"
        };

        // Data handler for SDK
        const dataHandler = {
            onDataChanged(data) {
                // This is a write-only form, so we don't need to display existing data
                console.log('Registration data updated:', data.length, 'records');
            }
        };

        // Initialize Data SDK
        async function initializeApp() {
            if (window.dataSdk) {
                const initResult = await window.dataSdk.init(dataHandler);
                if (!initResult.isOk) {
                    console.error('Failed to initialize data SDK');
                }
            }

            // Initialize Element SDK
            if (window.elementSdk) {
                await window.elementSdk.init({
                    defaultConfig,
                    onConfigChange: async (config) => {
                        // Update form title
                        const titleElement = document.getElementById('form-title');
                        if (titleElement) {
                            titleElement.textContent = config.form_title || defaultConfig.form_title;
                        }

                        // Update form subtitle
                        const subtitleElement = document.getElementById('form-subtitle');
                        if (subtitleElement) {
                            subtitleElement.textContent = config.form_subtitle || defaultConfig.form_subtitle;
                        }

                        // Update submit button text
                        const submitButtonText = document.getElementById('submit-button-text');
                        if (submitButtonText) {
                            submitButtonText.textContent = config.submit_button_text || defaultConfig.submit_button_text;
                        }

                        // Update colors
                        const primaryColor = config.primary_color || defaultConfig.primary_color;
                        const surfaceColor = config.surface_color || defaultConfig.surface_color;
                        const textColor = config.text_color || defaultConfig.text_color;

                        // Apply primary color to button and focus states
                        const submitBtn = document.getElementById('submitBtn');
                        if (submitBtn) {
                            submitBtn.style.backgroundColor = primaryColor;
                        }

                        // Apply surface color to form background
                        const form = document.getElementById('registrationForm');
                        if (form) {
                            form.style.backgroundColor = surfaceColor;
                        }

                        // Apply text color
                        const textElements = document.querySelectorAll('label, .text-gray-700, .text-gray-900');
                        textElements.forEach(element => {
                            element.style.color = textColor;
                        });
                    },
                    mapToCapabilities: (config) => ({
                        recolorables: [
                            {
                                get: () => config.primary_color || defaultConfig.primary_color,
                                set: (value) => {
                                    if (window.elementSdk) {
                                        window.elementSdk.setConfig({ primary_color: value });
                                    }
                                }
                            },
                            {
                                get: () => config.surface_color || defaultConfig.surface_color,
                                set: (value) => {
                                    if (window.elementSdk) {
                                        window.elementSdk.setConfig({ surface_color: value });
                                    }
                                }
                            },
                            {
                                get: () => config.text_color || defaultConfig.text_color,
                                set: (value) => {
                                    if (window.elementSdk) {
                                        window.elementSdk.setConfig({ text_color: value });
                                    }
                                }
                            }
                        ],
                        borderables: [],
                        fontEditable: undefined,
                        fontSizeable: undefined
                    }),
                    mapToEditPanelValues: (config) => new Map([
                        ["form_title", config.form_title || defaultConfig.form_title],
                        ["form_subtitle", config.form_subtitle || defaultConfig.form_subtitle],
                        ["submit_button_text", config.submit_button_text || defaultConfig.submit_button_text]
                    ])
                });
            }
        }

        // Form submission handler
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const loadingSpinner = document.getElementById('loading-spinner');
            const submitButtonText = document.getElementById('submit-button-text');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            
            // Show loading state
            submitBtn.disabled = true;
            loadingSpinner.classList.remove('hidden');
            successMessage.classList.add('hidden');
            errorMessage.classList.add('hidden');
            
            try {
                // Get form data
                const formData = new FormData(this);
                const registrationData = {
                    full_name: formData.get('fullName'),
                    age: formData.get('age'),
                    origin: formData.get('origin'),
                    education: formData.get('education'),
                    reason: formData.get('reason'),
                    path: formData.get('path'),
                    submitted_at: new Date().toISOString()
                };
                
                // Save to Data SDK
                if (window.dataSdk) {
                    const result = await window.dataSdk.create(registrationData);
                    
                    if (result.isOk) {
                        // Show success message
                        successMessage.classList.remove('hidden');
                        successMessage.classList.add('success-animation');
                        
                        // Prepare WhatsApp message
                        const whatsappMessage = `Halo! Saya telah mendaftar program dengan data berikut:

📝 *PENDAFTARAN PROGRAM*
👤 Nama: ${registrationData.full_name}
🎂 Usia: ${registrationData.age} tahun
📍 Asal: ${registrationData.origin}
🎓 Pendidikan: ${registrationData.education}
🛤️ Jalur: ${registrationData.path}

💭 *Alasan mengikuti program:*
${registrationData.reason}

Mohon konfirmasi dan informasi selanjutnya. Terima kasih! 🙏`;
                        
                        // Reset form
                        this.reset();
                        
                        // Scroll to success message
                        successMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        
                        // Redirect to WhatsApp after 2 seconds
                        setTimeout(() => {
                            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(whatsappMessage)}`;
                            // Try to open WhatsApp, fallback to copying message
                            try {
                                window.location.href = whatsappUrl;
                            } catch (error) {
                                // If WhatsApp doesn't open, show the message for manual copy
                                showWhatsAppMessage(whatsappMessage);
                            }
                        }, 2000);
                    } else {
                        throw new Error('Failed to save registration data');
                    }
                } else {
                    throw new Error('Data SDK not available');
                }
                
            } catch (error) {
                console.error('Registration error:', error);
                errorMessage.classList.remove('hidden');
                errorMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } finally {
                // Hide loading state
                submitBtn.disabled = false;
                loadingSpinner.classList.add('hidden');
            }
        });

        // Function to show WhatsApp message if direct redirect fails
        function showWhatsAppMessage(message) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4';
            messageDiv.innerHTML = `
                <div class="bg-white rounded-lg p-6 max-w-md w-full max-h-96 overflow-y-auto">
                    <h3 class="text-lg font-bold mb-4 text-gray-900">📱 Kirim Pesan WhatsApp</h3>
                    <p class="text-sm text-gray-600 mb-4">Salin pesan di bawah ini dan kirim melalui WhatsApp:</p>
                    <div class="bg-gray-50 p-3 rounded border text-sm mb-4 whitespace-pre-wrap">${message}</div>
                    <div class="flex gap-2">
                        <button onclick="copyToClipboard('${message.replace(/'/g, "\\'")}'); this.textContent='✅ Tersalin!'" 
                                class="flex-1 bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                            📋 Salin Pesan
                        </button>
                        <button onclick="this.parentElement.parentElement.parentElement.remove()" 
                                class="px-4 py-2 border border-gray-300 rounded hover:bg-gray-50">
                            Tutup
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(messageDiv);
        }

        // Function to copy text to clipboard
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).catch(() => {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            });
        }

        // Initialize the app when DOM is loaded
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
