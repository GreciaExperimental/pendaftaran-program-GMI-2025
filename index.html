<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pendaftaran</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body { box-sizing: border-box; }
    .success-animation { animation: successPulse 0.6s ease-out; }
    @keyframes successPulse {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .loading-spinner { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
  <style>@view-transition { navigation: auto; }</style>
</head>
<body class="h-full bg-gradient-to-br from-blue-50 to-indigo-100 font-sans">

  <div class="min-h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
      <!-- Header -->
      <div class="text-center">
        <div class="mx-auto h-12 w-12 bg-indigo-600 rounded-full flex items-center justify-center mb-4">
          <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
        <h2 id="form-title" class="text-3xl font-bold text-gray-900">Daftar Sekarang – Kuota Terbatas!</h2>
        <p id="form-subtitle" class="mt-2 text-sm text-red-600 font-medium">
          ⚡ Kesempatan terbatas! Segera daftar sebelum kuota habis
        </p>
      </div>

      <!-- Registration Form -->
      <form id="registrationForm" class="mt-8 space-y-6 bg-white p-8 rounded-xl shadow-lg">
        <!-- Full Name -->
        <div>
          <label for="fullName" class="block text-sm font-medium text-gray-700 mb-2">Nama Lengkap</label>
          <input type="text" id="fullName" name="fullName" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400
            focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
            placeholder="Masukkan nama lengkap Anda">
        </div>

        <!-- Age -->
        <div>
          <label for="age" class="block text-sm font-medium text-gray-700 mb-2">Usia</label>
          <input type="number" id="age" name="age" required min="16" max="65"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400
            focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
            placeholder="Contoh: 25">
        </div>

        <!-- Origin -->
        <div>
          <label for="origin" class="block text-sm font-medium text-gray-700 mb-2">Asal Daerah</label>
          <input type="text" id="origin" name="origin" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400
            focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
            placeholder="Contoh: Jakarta, Bandung, Surabaya">
        </div>

        <!-- Education -->
        <div>
          <label for="education" class="block text-sm font-medium text-gray-700 mb-2">Pendidikan Terakhir</label>
          <select id="education" name="education" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm
            focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500">
            <option value="">Pilih pendidikan terakhir</option>
            <option value="SMA/SMK">SMA/SMK</option>
            <option value="D3">Diploma 3 (D3)</option>
            <option value="S1">Sarjana (S1)</option>
            <option value="S2">Magister (S2)</option>
            <option value="S3">Doktor (S3)</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>

        <!-- Reason -->
        <div>
          <label for="reason" class="block text-sm font-medium text-gray-700 mb-2">Alasan Mengikuti Program</label>
          <textarea id="reason" name="reason" rows="4" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400
            focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
            placeholder="Ceritakan motivasi dan tujuan Anda mengikuti program ini..."></textarea>
        </div>

        <!-- Scholarship Path -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-3">Pilihan Jalur</label>
          <div class="space-y-3">
            <label class="flex items-center p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
              <input type="radio" name="path" value="Beasiswa" required
                class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300">
              <div class="ml-3">
                <span class="text-sm font-medium text-gray-900">🎓 Jalur Beasiswa</span>
                <p class="text-xs text-gray-500">Program gratis dengan syarat dan ketentuan berlaku</p>
              </div>
            </label>
            <label class="flex items-center p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
              <input type="radio" name="path" value="Non-Beasiswa" required
                class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300">
              <div class="ml-3">
                <span class="text-sm font-medium text-gray-900">💳 Jalur Non-Beasiswa</span>
                <p class="text-xs text-gray-500">Program berbayar dengan akses penuh</p>
              </div>
            </label>
          </div>
        </div>

        <!-- Submit Button -->
        <div>
          <button type="submit" id="submitBtn"
            class="w-full flex justify-center items-center py-4 px-6 border border-transparent rounded-lg shadow-lg text-lg font-bold text-white bg-green-600 hover:bg-green-700
            focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed transform hover:scale-105">
            <span class="text-2xl mr-2">🟢</span>
            <span id="submit-button-text">KIRIM FORM & HUBUNGI VIA WHATSAPP</span>
            <svg id="loading-spinner" class="hidden ml-2 h-5 w-5 loading-spinner" fill="none" stroke="currentColor"
              viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"></circle>
              <path fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                class="opacity-75"></path>
            </svg>
          </button>
        </div>

        <!-- Success & Error Messages -->
        <div id="successMessage" class="hidden mt-4 p-4 bg-green-50 border border-green-200 rounded-md">
          <div class="flex items-center">
            <svg class="h-5 w-5 text-green-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <div>
              <p class="text-sm text-green-800 font-medium">✅ Pendaftaran berhasil tersimpan!</p>
              <p class="text-xs text-green-700 mt-1">Anda akan diarahkan ke WhatsApp untuk konfirmasi lebih lanjut...</p>
            </div>
          </div>
        </div>
        <div id="errorMessage" class="hidden mt-4 p-4 bg-red-50 border border-red-200 rounded-md">
          <div class="flex items-center">
            <svg class="h-5 w-5 text-red-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p class="text-sm text-red-800">Terjadi kesalahan. Silakan coba lagi.</p>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('registrationForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const loadingSpinner = document.getElementById('loading-spinner');
      const successMessage = document.getElementById('successMessage');
      const errorMessage = document.getElementById('errorMessage');

      submitBtn.disabled = true;
      loadingSpinner.classList.remove('hidden');
      successMessage.classList.add('hidden');
      errorMessage.classList.add('hidden');

      try {
        const formData = new FormData(this);
        const registrationData = {
          full_name: formData.get('fullName'),
          age: formData.get('age'),
          origin: formData.get('origin'),
          education: formData.get('education'),
          reason: formData.get('reason'),
          path: formData.get('path'),
          submitted_at: new Date().toISOString()
        };

        const whatsappMessage = `Halo! Saya telah mendaftar program dengan data berikut:

📝 *PENDAFTARAN PROGRAM*
👤 Nama: ${registrationData.full_name}
🎂 Usia: ${registrationData.age} tahun
📍 Asal: ${registrationData.origin}
🎓 Pendidikan: ${registrationData.education}
🛤️ Jalur: ${registrationData.path}

💭 *Alasan mengikuti program:*
${registrationData.reason}

Mohon konfirmasi dan informasi selanjutnya. Terima kasih! 🙏`;

        successMessage.classList.remove('hidden');
        this.reset();

        setTimeout(() => {
          const whatsappUrl = `https://wa.me/6281281100065?text=${encodeURIComponent(whatsappMessage)}`;
          window.location.href = whatsappUrl;
        }, 2000);

      } catch (error) {
        console.error('Registration error:', error);
        errorMessage.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        loadingSpinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
